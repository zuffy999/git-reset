<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="icon" type="image/x-icon" href="./static/images/icon.ico">
    <link rel="stylesheet" href="./static/styles/reset.css">
    <link rel="stylesheet" href="./static/styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="main-section">
        <header>
            <div class="wrapper header-container">
                <div class="header-logo">
                    <span>Doctor</span>
                    <img src="./static/images/logo.svg" alt="Doctor logo">
                </div>
                <nav class="header-navigate">
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Services</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>
                <a class="header-button" href="#">
                    <img src="./static/images/message-circle.svg" alt="Chat icon">
                    <span>Book Now</span>
                </a>
            </div>
        </header>

        <div class="wrapper main-content">
            <div class="main-content-column main-content-info">
                <span class="main-content-subtitle">Dr. Matthew Anderson</span>
                <h1 class="main-content-title">A dedicated doctor<br>you can trust</h1>
                <p class="main-content-text">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit.<br>
                    Elementum eget vel, nunc nulla feugiat. Metus ut.
                </p>
                <a class="header-button main-content-button" href="#">
                    <img src="./static/images/message-circle.svg" alt="Chat icon">
                    <span>Book an appointment</span>
                </a>
            </div>

            <div class="main-content-column main-content-media">
                <img class="main-content-slide" src="./static/images/doctors.png" alt="doctors">
                <img class="main-content-plus-one" src="./static/images/plus.png" alt="">
                <img class="main-content-plus-two" src="./static/images/plus.png" alt="">
                <img class="main-content-plus-three" src="./static/images/plus 3.png" alt="">
                <img class="main-content-plus-four" src="./static/images/plus 2.png" alt="">
            </div>
        </div>
    </section>
</body>
</html>
